name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Generate iOS native project (Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Build Xcode Workspace without code signing
        run: |
          xcodebuild \
            -workspace ios/tikholife.xcworkspace \
            -scheme tikholife \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/tikho.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/tikho.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r Tikho.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tikho-iOS-Sideloadly
          path: build/Tikho.ipa
          retention-days: 7
