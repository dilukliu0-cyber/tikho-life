name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check available Xcode versions
        run: |
          ls -d /Applications/Xcode*.app || true

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Patch Swift tools version for Xcode compatibility
        run: |
          find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} +
          find node_modules -name "Package.swift" -exec sed -i '' 's/602.0.0-latest/600.0.0/g' {} +

      - name: Generate iOS native project (Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Build Xcode Workspace without code signing
        run: |
          xcodebuild \
            -workspace ios/Tiho.xcworkspace \
            -scheme Tiho \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tiho.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Tiho.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -y Tikho.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tikho-iOS-Sideloadly
          path: build/Tikho.ipa
          retention-days: 7
