name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Patch for Swift 6.1 compatibility
        run: node scripts/patch-swiftpm.js

      - name: Generate iOS native project (Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        working-directory: ios
        run: pod install

      - name: Re-patch after pod install
        run: node scripts/patch-swiftpm.js

      - name: Build Xcode Workspace without code signing
        run: |
          xcodebuild \
            -workspace ios/Tiho.xcworkspace \
            -scheme Tiho \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tiho.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -skipPackagePluginValidation \
            -skipMacroValidation

      - name: Package .app into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Tiho.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -y Tikho.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tikho-iOS-Sideloadly
          path: build/Tikho.ipa
          retention-days: 7
